<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slash Photo</title>
<meta name="description" content="100 perintah /slash untuk mengubah foto dengan AI — semua bisa diedit.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slash Photo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ───────────── STUDIO ───────────── -->
  <section class="view" id="view-studio" data-view="studio">
    <header class="nav">
      <h1 class="nav-title" data-app-name>Slash Photo</h1>
      <span class="nav-meta" id="engine-pill"></span>
    </header>

    <div id="stage-error"></div>
    <div id="stage" class="stage"></div>
    <div id="stage-actions" class="stage-actions"></div>

    <div class="rail" id="filters" role="tablist" aria-label="Kategori"></div>
    <div class="grid" id="grid"></div>
    <div class="composer-spacer"></div>
  </section>

  <!-- ───────────── EFEK ───────────── -->
  <section class="view" id="view-presets" data-view="presets" hidden>
    <header class="nav">
      <h1 class="nav-title">Efek</h1>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-reorder" type="button">Atur</button>
        <button class="nav-btn nav-btn-icon" id="btn-add-preset" type="button" aria-label="Efek baru">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="preset-search" type="search" placeholder="Cari perintah, nama, atau isi prompt" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Cari efek">
    </div>
    <div id="preset-list"></div>
  </section>

  <!-- ───────────── GALERI ───────────── -->
  <section class="view" id="view-gallery" data-view="gallery" hidden>
    <header class="nav">
      <h1 class="nav-title">Galeri</h1>
      <span class="nav-meta" id="gallery-count"></span>
    </header>
    <div id="gallery"></div>
  </section>

  <!-- ───────────── SETELAN ───────────── -->
  <section class="view" id="view-settings" data-view="settings" hidden>
    <header class="nav">
      <h1 class="nav-title">Setelan</h1>
    </header>
    <div id="settings"></div>
  </section>

  <!-- composer (studio only) -->
  <div class="composer" id="composer">
    <div class="suggest" id="suggest" hidden></div>
    <div class="sel" id="sel" hidden></div>
    <div class="composer-row">
      <input id="cmd-input" type="text" enterkeyhint="go" placeholder="Ketik / atau tulis instruksi" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Perintah atau instruksi tambahan">
      <button class="icon-btn" id="btn-prompt" type="button" aria-label="Lihat dan edit prompt akhir">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 4c-2.2 0-3 1-3 3v2.5c0 1.4-.6 2.5-2 2.5 1.4 0 2 1.1 2 2.5V17c0 2 .8 3 3 3M15 4c2.2 0 3 1 3 3v2.5c0 1.4.6 2.5 2 2.5-1.4 0-2 1.1-2 2.5V17c0 2-.8 3-3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="go-btn" id="btn-go" type="button" aria-label="Buat gambar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- tab bar -->
  <nav class="tabbar" id="tabbar" aria-label="Navigasi utama">
    <button type="button" data-tab="studio" aria-current="page">
      <svg viewBox="0 0 24 24" width="25" height="25"><rect x="3.5" y="6" width="17" height="13" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 6 10 3.8h4L15.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m13.6 9.2-3.2 6.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Studio</span>
    </button>
    <button type="button" data-tab="presets">
      <svg viewBox="0 0 24 24" width="25" height="25"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 8-4 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Efek</span>
    </button>
    <button type="button" data-tab="gallery">
      <svg viewBox="0 0 24 24" width="25" height="25"><rect x="3.5" y="7" width="14" height="13" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 4h10.500a3 3 0 0 1 3 3v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m4 17 3.8-3.8 2.7 2.7 2.3-2.3 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>Galeri</span>
    </button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" width="25" height="25"><path d="M5 7h7M16 7h3M5 12h2M11 12h8M5 17h9M18 17h1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Setelan</span>
    </button>
  </nav>
</div>

<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="file-lib" accept="image/*" hidden>
<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>

<script src="presets.js"></script>
<script src="app.js"></script>
</body>
</html>
